# Loki v3.6.20 Windows 单机配置（schema v13 + tsdb）
# 已验证前台能正常启动（listening on http=127.0.0.1:3100）
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096

common:
  path_prefix: D:\smart-medical\observability\loki-data
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
    # 强制用 127.0.0.1 注册，避免 Windows hostname 解析问题
    instance_addr: 127.0.0.1

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: D:\smart-medical\observability\loki-data\chunks
  tsdb_shipper:
    active_index_directory: D:\smart-medical\observability\loki-data\index-active
    cache_location: D:\smart-medical\observability\loki-data\index-cache

limits_config:
  allow_structured_metadata: false
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_entries_limit_per_query: 5000

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
    final_sleep: 0s
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  # Windows 上 WAL 容易留坏文件，禁用
  wal:
    enabled: false
