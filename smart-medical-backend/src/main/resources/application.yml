server:
  port: 8080
  servlet:
    context-path: /api/smart-medical/v1

spring:
  # 本地密钥文件（不入版本库）：api-key 等敏感配置放运行目录下 ai-secret.yml
  config:
    import: optional:file:./ai-secret.yml
  application:
    name: smart-medical
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_medical?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    # 高并发调优：连接池扩容（默认仅 10 连接，并发登录/查询会排队甚至报错）
    # 提示：本机 MySQL max_connections 需同步调大（默认 151），否则池扩大会触发 MySQL 拒绝连接
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartMedicalHikariPool
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      # Docker 部署的 Redis：默认 localhost:6379；若容器映射了其他端口或设置了密码，改下面三项（也可用环境变量覆盖）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms

# 本地文件上传（Demo 头像等，存服务运行目录下 uploads/）
app:
  upload-dir: ./uploads
  # 号源兜底：默认关闭（生产号源必须来自管理端真实排班）；demo profile 下由 application-demo.yml 打开
  schedule:
    auto-seed: false
  security:
    # 是否在"忘记密码"接口回显验证码：默认 false，生产走短信；demo profile 下打开
    expose-verification-code: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hospital.smartmedical.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    # 高并发调优：关闭 SQL 全量 stdout 日志，避免日志刷屏消耗 CPU/IO（排查 SQL 时可临时改回 StdOutImpl）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
# 密钥不再硬编码：从环境变量 JWT_SECRET 或本地 ai-secret.yml（已被 .gitignore 忽略）读取。
# 缺失或少于 32 字节时应用启动失败（JwtUtil 启动校验），避免用弱密钥上线。
jwt:
  secret: ${JWT_SECRET:}
  expire-minutes: 1440  # 24h

# Caffeine
caffeine:
  expire-minutes: 30
  max-size: 1000

# AI  Config (真实大模型：DeepSeek OpenAI 兼容接口)
ai:
  # true=本地规则模拟回复（开发演示用，不发外部请求）；false=调用真实大模型（需配置 ai.llm）
  mock-mode: false
  # 会话 State 存储：redis=Redis 持久化（重启后会话不丢，key: ai:session:{sessionId}，TTL 24h）
  # 切回内存：把下面改成 memory（MemoryAiStateStore 仅在 memory 时生效）
  state-store: redis
  # Redis 故障时的降级熔断时长（秒）：失败后这段时间内直接走内存，不再尝试 Redis，避免每个请求都等待连接超时
  state-store-fallback-cooldown-seconds: 30
  # 语义缓存（P2 命中返回：相似问题直接回放缓存答案省 LLM token；shadow=true 退回影子统计）
  # v3 起引入「分类白名单 + 按类 TTL」：只缓存流程类与通用常识类，症状/用药类一律不入缓存
  semantic-cache:
    enabled: true                        # 总开关（false 时完全不参与）
    shadow: false                        # false=P2 命中返回（向量命中+Redis 答案未过期则直接回复）；true=影子统计
    threshold: 0.92                      # 命中相似度阈值（余弦相似度，保守）
    flow-ttl-days: 30                    # 流程/指引类缓存 TTL（天）：挂号流程、就诊须知、医保报销等
    common-ttl-days: 3                   # 通用常识类缓存 TTL（天）：挂什么科、体检注意等
    require-disclaimer: false            # true=答案必须含免责声明才允许返回（开启前建议先让提示词输出声明）
    collection: "sm_semantic_cache"      # 缓存向量集合（独立于知识库集合）
    top-k: 3                             # 检索候选数
    sample-rate: 100                     # 命中返回灰度采样率（0-100）：100=命中即返回；10=仅 10% 命中真正返回，其余只统计（影子模式忽略）
  llm:
    # OpenAI 兼容大模型配置（接入真实模型时填写，mock-mode=false 时生效）
    base-url: "https://api.deepseek.com"   # DeepSeek OpenAI 兼容地址
    api-key: "${AI_LLM_API_KEY:}"   # API Key（本地密钥放 ai-secret.yml，不入库）
    model: "deepseek-flash"                # 模型名
    temperature: 0.7
    timeout-seconds: 60
    max-retries: 2
    # 向量模型配置（科室介绍库 RAG 向量化用）
    # 千问：填入 API Key 后启用 qwen3.7-text-embedding；api-key 留空则自动降级本地 BGE-small-zh-v1.5
    embedding:
      base-url: "https://ws-vs7utchsqtpnzykd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"   # 千问 OpenAI 兼容地址（百炼专属端点，注意路径为 /compatible-mode/v1）
      api-key: "${AI_EMBEDDING_API_KEY:}"   # 千问向量模型 API Key（本地密钥放 ai-secret.yml，不入库）
      model: "qwen3.7-text-embedding"                                 # 千问向量模型名
      dimension: 1024                                                 # 向量维度
      # Milvus 向量库连接（科室介绍库向量持久化存储与检索，替换内存 InMemoryEmbeddingStore）
      milvus:
        enabled: true                                                  # 是否启用 Milvus 向量库（false 回退内存向量库）
        host: "localhost"                                              # Milvus 服务地址
        port: 19530                                                    # Milvus 端口（gRPC）
        collection-name: "smart_medical_knowledge"                     # 向量集合名
        database-name: ""                                              # 数据库名（空=默认库）

# Sensitive words
sensitive:
  words: 政治,暴力,自杀,枪支,炸药,违禁药,色情,毒品
