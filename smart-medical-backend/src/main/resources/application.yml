server:
  port: 8080
  servlet:
    context-path: /api/smart-medical/v1

spring:
  application:
    name: smart-medical
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_medical?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# 本地文件上传（Demo 头像等，存服务运行目录下 uploads/）
app:
  upload-dir: ./uploads

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hospital.smartmedical.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: smart-medical-local-demo-secret-key-2026-demo-only
  expire-minutes: 1440  # 24h

# Caffeine
caffeine:
  expire-minutes: 30
  max-size: 1000

# AI Demo Config (无FastAPI，本地模拟)
ai:
  mock-mode: true

# Sensitive words
sensitive:
  words: 政治,暴力,自杀,枪支,炸药,违禁药,色情,毒品
